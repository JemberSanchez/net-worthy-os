<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "InterX"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "InterX"; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "InterX"; src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      :root {
        --bg: #0a1a14; --bg2: #0e241b; --ink: #f4f6f3; --gold: #d8b25a; --green: #1f9e6e; --mute: #8da298;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "InterX", sans-serif; color: var(--ink); }
      .full { position: absolute; inset: 0; }
      .clip { position: absolute; inset: 0; }

      /* ---------- persistent ground ---------- */
      #ground { background: radial-gradient(120% 80% at 50% 38%, #123a2a 0%, var(--bg2) 45%, var(--bg) 100%); }
      #glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 120px; border-radius: 50%;
              background: radial-gradient(circle, rgba(216,178,90,0.22) 0%, rgba(216,178,90,0) 60%); }
      #gridwrap { position: absolute; left: -200px; right: -200px; bottom: -60px; height: 900px; perspective: 700px; }
      #grid { position: absolute; inset: 0; transform-origin: 50% 100%;
              background-image: linear-gradient(rgba(31,158,110,0.28) 2px, transparent 2px), linear-gradient(90deg, rgba(31,158,110,0.28) 2px, transparent 2px);
              background-size: 120px 120px; -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); mask-image: linear-gradient(to top, #000 0%, transparent 85%); }
      #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.65) 100%); pointer-events: none; }
      #grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; opacity: 0.11; mix-blend-mode: overlay;
               background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #flash { background: var(--gold); opacity: 0; mix-blend-mode: screen; }

      /* ---------- brand + progress ---------- */
      #brand { position: absolute; top: 120px; width: 100%; text-align: center; font-weight: 800; letter-spacing: 0.42em; font-size: 26px; color: var(--gold); }
      #progress { position: absolute; top: 0; left: 0; height: 10px; width: 1080px; background: linear-gradient(90deg, var(--green), var(--gold)); transform-origin: 0 50%; }

      /* ---------- scene typography ---------- */
      #cam { position: absolute; inset: 0; transform-origin: 50% 42%; }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 420px; }
      .kicker { font-weight: 800; font-size: 40px; letter-spacing: 0.3em; color: var(--mute); margin-bottom: 26px; }
      .huge { font-family: "Anton", sans-serif; font-size: 230px; line-height: 0.92; text-transform: uppercase; text-align: center; letter-spacing: 0.005em; }
      .big { font-family: "Anton", sans-serif; font-size: 150px; line-height: 0.95; text-transform: uppercase; text-align: center; }
      .gold { color: var(--gold); }
      .green { color: var(--green); }
      .icon { width: 360px; height: 360px; margin-bottom: 40px; overflow: visible; }
      .icon path, .icon line, .icon rect, .icon circle { fill: none; stroke: var(--gold); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }

      /* paycheck card */
      #check { width: 820px; height: 380px; border-radius: 28px; background: linear-gradient(160deg, #f4f6f3, #d9e2dc); color: #0a1a14; position: relative;
               box-shadow: 0 40px 90px rgba(0,0,0,0.55); padding: 44px 52px; margin-bottom: 70px; }
      #check .row { display: flex; justify-content: space-between; font-weight: 800; font-size: 30px; letter-spacing: 0.12em; color: #5e6f66; }
      #check .amt { font-family: "Anton", sans-serif; font-size: 120px; margin-top: 38px; color: #0a1a14; }
      #check .line { position: absolute; left: 52px; right: 52px; bottom: 60px; height: 4px; background: #8da298; }
      #stamp { position: absolute; right: 36px; top: 150px; border: 10px solid #c0392b; color: #c0392b; font-family: "Anton", sans-serif; font-size: 84px; padding: 4px 26px; border-radius: 14px; }

      /* chart */
      #three-layer { position: absolute; inset: 0; width: 1080px; height: 1920px; z-index: 0; }
      #who, #money, #moneyLabel, #coins { z-index: 2; }
      #money { position: absolute; top: 440px; width: 100%; text-align: center; font-family: "Anton", sans-serif; font-size: 168px; color: var(--ink);
               text-shadow: 0 0 60px rgba(216,178,90,0.0); font-variant-numeric: tabular-nums; }
      #moneyLabel { position: absolute; top: 690px; width: 100%; text-align: center; font-weight: 800; font-size: 40px; letter-spacing: 0.28em; color: var(--mute); }
      #who { position: absolute; top: 250px; width: 100%; text-align: center; }
      #who .nm { font-family: "Anton", sans-serif; font-size: 120px; color: var(--gold); }
      #who .yrs { font-weight: 800; font-size: 34px; letter-spacing: 0.3em; color: var(--mute); margin-top: 6px; }
      .coin { position: absolute; left: 540px; top: 560px; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
              background: radial-gradient(circle at 35% 30%, #f3dc9a, #d8b25a 55%, #9c7a2e); color: #6b5217; font-family: "Anton", sans-serif; font-size: 44px;
              display: flex; align-items: center; justify-content: center; opacity: 0; }

      /* captions */
      #caps { position: absolute; left: 60px; right: 60px; top: 1300px; height: 200px; display: flex; align-items: center; justify-content: center; }
      .cg { position: absolute; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 34px; opacity: 0; }
      .w { font-weight: 900; font-size: 74px; text-transform: uppercase; color: var(--ink); letter-spacing: -0.01em;
           text-shadow: 0 6px 0 rgba(0,0,0,0.55), 0 0 30px rgba(0,0,0,0.6); display: inline-block; }
    </style>
  </head>

      WORDS.forEach((w, i) => { cur.push(w); const endSent = /[.,]$/.test(w.text); const gap = WORDS[i + 1] ? WORDS[i + 1].start - w.end : 1; if (cur.length === 3 || endSent || gap > 0.25) { groups.push(cur); cur = []; } });
      if (cur.length) groups.push(cur);
      groups.forEach((g, gi) => {
        const el = document.createElement("div"); el.className = "cg"; el.id = "cg" + gi; caps.appendChild(el);
        const gStart = g[0].start - 0.05, gEnd = (groups[gi + 1] ? Math.min(groups[gi + 1][0].start - 0.05, g[g.length - 1].end + 0.35) : D);
        tl.fromTo(el, { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.1, ease: "power2.out" }, gStart);
        tl.to(el, { opacity: 0, duration: 0.05 }, gEnd - 0.05);
        g.forEach((w, wi) => {
          const s = document.createElement("span"); s.className = "w"; s.id = `w${gi}_${wi}`; s.textContent = w.text.replace(/[.,]$/, ""); el.appendChild(s);
          const hot = HOT.has(w.text);
          tl.fromTo(s, { color: "#f4f6f3", scale: 1 }, { color: hot ? "#d8b25a" : "#9fe3c4", scale: hot ? 1.1 : 1.04, duration: 0.08, ease: "power2.out" }, w.start - 0.04);
          tl.to(s, { color: "#f4f6f3", scale: 1, duration: 0.1 }, w.end);
        });
      });

      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "./assets/three/three.module.min.js";
      import { RoomEnvironment } from "./assets/three/RoomEnvironment.js";

      // Same money curve as the HTML counter (GSAP power1.in = u^2, power3.in = u^4).
      const P1 = [4.37, 2.1, 450000], P2 = [6.47, 1.04, 8000000];
      const timeForValue = (v) => v <= P1[2]
        ? P1[0] + P1[1] * Math.sqrt(v / P1[2])
        : P2[0] + P2[1] * Math.pow((v - P1[2]) / (P2[2] - P1[2]), 0.25);

      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false); renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      const camera = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.1, 200);

      const key = new THREE.DirectionalLight(0xfff1d0, 2.4); key.position.set(4, 9, 6); scene.add(key);
      const rim = new THREE.DirectionalLight(0x1f9e6e, 1.6); rim.position.set(-6, 3, -5); scene.add(rim);
      const burst = new THREE.PointLight(0xffd27a, 0, 30); burst.position.set(3.8, 5, 2.5); scene.add(burst);

      const grid = new THREE.GridHelper(24, 24, 0x1f9e6e, 0x1f9e6e);
      grid.material.transparent = true; grid.material.opacity = 0.22; scene.add(grid);

      // 9 decades, exponential weights -> coins per column and $ per column (sum = $8M).
      const COLS = 9, SP = 0.92, CH = 0.14, w = [...Array(COLS)].map((_, i) => Math.exp(0.45 * i));
      const W = w.reduce((a, b) => a + b, 0);
      const counts = w.map((x) => Math.round(27 * x / w[COLS - 1]) + 1);
      const coins = []; let cum = 0;
      for (let c = 0; c < COLS; c++) {
        const colValue = 8000000 * w[c] / W, unit = colValue / counts[c];
        for (let j = 0; j < counts[c]; j++) {
          const thr = cum + unit * (j + 0.5);
          coins.push({ c, j, t: Math.min(timeForValue(Math.min(thr, 7999999)), 7.49) });
        }
        cum += colValue;
      }
      const geo = new THREE.CylinderGeometry(0.42, 0.42, CH * 0.86, 48);
      const mat = [new THREE.MeshStandardMaterial({ color: 0xa8812f, metalness: 0.95, roughness: 0.42 }), new THREE.MeshStandardMaterial({ color: 0xe6c46e, metalness: 0.85, roughness: 0.18 }), new THREE.MeshStandardMaterial({ color: 0xe6c46e, metalness: 0.85, roughness: 0.18 })];
      const mesh = new THREE.InstancedMesh(geo, mat, coins.length); scene.add(mesh);
      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3(1, 1, 1);
      // deterministic per-coin jitter
      let seed = 99; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      coins.forEach((k) => { k.dx = (rnd() - 0.5) * 0.06; k.dz = (rnd() - 0.5) * 0.06; k.rot = rnd() * 6.28; });

      const clamp = (x) => Math.max(0, Math.min(1, x));
      function renderAt(time) {
        const FALL = 0.26;
        coins.forEach((k, i) => {
          const u = clamp((time - k.t) / FALL);
          const vis = time >= k.t;
          const drop = (1 - u * u) * 3.2 + Math.sin(Math.min(1, u) * Math.PI) * 0.0;
          const settle = u >= 1 ? Math.max(0, 0.05 * Math.sin((time - k.t - FALL) * 30) * Math.exp(-(time - k.t - FALL) * 12)) : 0;
          pos.set((k.c - (COLS - 1) / 2) * SP + k.dx, CH / 2 + k.j * CH + drop + settle, k.dz);
          q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), k.rot);
          sc.setScalar(vis ? 1 : 0.0001);
          m4.compose(pos, q, sc); mesh.setMatrixAt(i, m4);
        });
        mesh.instanceMatrix.needsUpdate = true;
        // camera: slow orbit + push, shake on the $8M hit
        const p = clamp((time - 3.95) / 3.9);
        const yaw = -0.26 + 0.2 * p, dist = 31 - 1.5 * p;
        const hit = time > 7.5 ? Math.exp(-(time - 7.5) * 9) : 0;
        const shake = hit * 0.12 * Math.sin(time * 90);
        camera.position.set(Math.sin(yaw) * dist + shake, 11.5 + 0.8 * p, Math.cos(yaw) * dist);
        camera.lookAt(0.3, 3.0 + shake, 0);
        burst.intensity = hit * 60;
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
