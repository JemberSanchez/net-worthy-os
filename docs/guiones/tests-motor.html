<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tests del motor de Shorts — Net Worthy</title>
<style>
  body{background:#0A1A14;color:#F4F6F3;font:15px/1.5 system-ui,sans-serif;margin:0;padding:28px 24px;max-width:900px}
  h1{color:#D8B25A;font-size:20px;margin:0 0 4px}
  .sub{color:#5C6E64;margin:0 0 20px}
  #res{font-weight:800;font-size:18px;padding:10px 14px;border-radius:8px;display:inline-block;margin-bottom:16px}
  .ok{background:#123}  .bad{background:#3a1a1a}
  .t{padding:7px 10px;border-bottom:1px solid #16261f;display:flex;gap:10px;align-items:baseline}
  .p{color:#1F9E6E;font-weight:700} .f{color:#C0968C;font-weight:700}
  .n{flex:1} .d{color:#5C6E64;font-size:13px}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none}
</style>
</head>
<body>
<h1>Tests del motor de Shorts</h1>
<p class="sub">Verifica la lógica PURA del renderizador (audio, calibración, eventos, determinismo).
  Sin dependencias: carga <code>short-renderer.html</code> en un iframe y comprueba sus funciones.
  <strong>Sírvelo por http://localhost:8765</strong> (desde file:// el iframe se bloquea).</p>
<div id="res">corriendo…</div>
<div id="out"></div>
<iframe id="motor" src="short-renderer.html"></iframe>

<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
const pendientes = [];               // tests async: se esperan antes del resumen

function pinta(nombre, okv, detalle){
  okv ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 't';
  d.innerHTML = `<span class="${okv?'p':'f'}">${okv?'PASA':'FALLA'}</span>` +
                `<span class="n">${nombre}</span><span class="d">${detalle}</span>`;
  out.appendChild(d);
}
// fn puede ser síncrona (devuelve true|detalle) o async (Promise de lo mismo).
function check(nombre, fn){
  try {
    const r = fn();
    if (r && typeof r.then === 'function'){
      pendientes.push(r.then(v => pinta(nombre, v === true, v === true ? '' : String(v)))
                       .catch(e => pinta(nombre, false, 'EXCEPCIÓN: ' + e.message)));
      return;
    }
    pinta(nombre, r === true, r === true ? '' : String(r));
  } catch (e){ pinta(nombre, false, 'EXCEPCIÓN: ' + e.message); }
}
const cerca = (a, b, tol) => Math.abs(a-b) <= tol ? true : `esperaba ~${b} (±${tol}), dio ${a}`;

document.getElementById('motor').onload = async () => {
  const W = document.getElementById('motor').contentWindow;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const SR = 48000;

  // helpers: buffers sintéticos con nivel conocido
  const buf = (dur, fn) => {
    const n = Math.floor(dur*SR), b = ctx.createBuffer(1, n, SR), d = b.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = fn(i/SR, i);
    return b;
  };
  const rms = b => { const d=b.getChannelData(0); let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i]; return Math.sqrt(s/d.length); };
  // voz sintética: habla la mitad del tiempo (simula los silencios de un TTS)
  const voz = buf(4, (t) => (t % 1) < 0.5 ? 0.5*Math.sin(2*Math.PI*220*t) : 0);
  const mus = buf(2, (t) => 0.3*Math.sin(2*Math.PI*440*t));

  // ── AUTO-GAIN de música ────────────────────────────────────────────────
  check('gainMusicaAuto existe y devuelve una ganancia acotada', () => {
    const g = W.gainMusicaAuto(voz, mus);
    return (g > 0.02 && g <= 0.5) ? true : `fuera de rango: ${g}`;
  });

  check('gainMusicaAuto es INDEPENDIENTE de la pista (fuerte y floja acaban igual)', () => {
    // niveles realistas (música normalizada de biblioteca): 4x de diferencia, dentro del rango útil
    const fuerte = buf(2, (t) => 0.60*Math.sin(2*Math.PI*440*t));
    const floja  = buf(2, (t) => 0.15*Math.sin(2*Math.PI*440*t));
    const nf = rms(fuerte) * W.gainMusicaAuto(voz, fuerte);
    const nl = rms(floja)  * W.gainMusicaAuto(voz, floja);
    return cerca(nf, nl, nl*0.10);   // mismo nivel percibido (±10%)
  });

  check('gainMusicaAuto: el TOPE de seguridad actúa con pistas patológicas', () => {
    // una pista casi muda pediría ganancia >1 (amplificar ruido): se acota en 0.5
    const casiMuda = buf(2, (t) => 0.01*Math.sin(2*Math.PI*440*t));
    const g = W.gainMusicaAuto(voz, casiMuda);
    return g === 0.5 ? true : `esperaba el tope 0.5, dio ${g}`;
  });

  check('gainMusicaAuto mide la voz SOLO donde habla (los silencios no la hunden)', () => {
    // misma voz pero con el doble de silencio: la ganancia NO debe cambiar apenas
    const vozMasSilencio = buf(8, (t) => (t % 2) < 0.5 ? 0.5*Math.sin(2*Math.PI*220*t) : 0);
    const a = W.gainMusicaAuto(voz, mus), b = W.gainMusicaAuto(vozMasSilencio, mus);
    return cerca(b, a, a*0.15);
  });

  // ── MEZCLA de música (ducking) ─────────────────────────────────────────
  check('mezclarMusica: no clippea nunca', () => {
    const N = voz.length;
    const canal = new Float32Array(N); canal.set(voz.getChannelData(0));
    const mix = W.mezclarMusica([canal], mus, N, SR, {gain:0.4});
    let mx=0; for (const v of mix[0]) mx = Math.max(mx, Math.abs(v));
    return mx <= 0.97 ? true : `pico ${mx.toFixed(3)} > 0.97`;
  });

  check('mezclarMusica: la voz AGACHA la música (ducking sidechain)', () => {
    const N = voz.length;
    const canal = new Float32Array(N); canal.set(voz.getChannelData(0));
    const mix = W.mezclarMusica([canal], mus, N, SR, {gain:0.3, fadeIn:0.05, fadeOut:0.05});
    const o = mix[0], v = canal;
    // aporte de la música donde HAY voz vs donde NO hay
    const aporte = (i0,i1) => { let s=0,n=0; for(let i=i0;i<i1;i++){ s+=Math.abs(o[i]-v[i]); n++; } return s/n; };
    const conVoz = aporte(Math.floor(0.1*SR), Math.floor(0.4*SR));   // habla
    const sinVoz = aporte(Math.floor(0.6*SR), Math.floor(0.9*SR));   // silencio
    return sinVoz > conVoz*1.5 ? true : `sin voz ${sinVoz.toFixed(4)} debería superar a con voz ${conVoz.toFixed(4)}`;
  });

  // ── DISEÑO DE SONIDO por eventos ───────────────────────────────────────
  check('eventosSonido deriva los ticks de los bullets y el hit del stat', () => {
    const t = {hook:2, curve:10, cta:20};
    const cfg = { overlays: [
      {escena:'bullets', desde:2, cadencia_s:2, items:['a','b','c']},
      {escena:'stat', desde:()=>t.curve, conteo_s:1.5},
    ]};
    const ev = W.eventosSonido(cfg, t);
    const ticksOk = JSON.stringify(ev.ticks) === JSON.stringify([2.35, 4.35, 6.35]);
    const hitOk = ev.hits.length===1 && Math.abs(ev.hits[0]-11.5) < 0.01;
    const riserOk = ev.risers.length===1 && Math.abs(ev.risers[0]-10) < 0.01;
    return (ticksOk && hitOk && riserOk) ? true : `ticks=${ev.ticks} hits=${ev.hits} risers=${ev.risers}`;
  });

  // ── CADENCIA de bullets (anti pantalla-congelada) ──────────────────────
  check('cadenciaBullets: si el Short la fija, manda', () => {
    return W.cadenciaBullets({cadencia_s:2.6, desde:0, hasta:13, items:['a','b','c']}) === 2.6
      ? true : 'ignoró la cadencia explícita';
  });

  // el test flojo (50-90%) dejó pasar un off-by-one que dejaba 6.4s muertos: ahora exige 68-85%
  check('cadenciaBullets: el ÚLTIMO item entra al 68-85% del tramo (mata el hold muerto)', () => {
    const casos = [ {win:13, n:3}, {win:18, n:3}, {win:9, n:4}, {win:20, n:5} ];
    for (const {win, n} of casos){
      const items = Array.from({length:n}, (_,i)=>'x'+i);
      const cad = W.cadenciaBullets({desde:2, hasta:2+win, items});
      const frac = (0.35 + (n-1)*cad) / win;
      if (frac < 0.68 || frac > 0.85)
        return `win=${win} n=${n}: el último entra al ${(frac*100).toFixed(0)}% (fuera de 68-85%)`;
    }
    return true;
  });

  check('cadenciaBullets: acepta desde/hasta como funciones', () => {
    const cad = W.cadenciaBullets({desde:()=>2, hasta:()=>15, items:['a','b','c']});
    return cad > 0.6 ? true : `dio ${cad}`;
  });

  check('cadenciaBullets: ventana inválida o 1 solo item -> default seguro', () => {
    const neg = W.cadenciaBullets({desde:10, hasta:2, items:['a','b']});
    const uno = W.cadenciaBullets({desde:0, hasta:10, items:['a']});   // n-1 = 0: no dividir por cero
    return (neg === 1.6 && uno === 1.6) ? true : `neg=${neg} uno=${uno}`;
  });

  // ── AUTO-SYNC del stat ─────────────────────────────────────────────────
  check('autoSyncStat: el conteo termina cuando la voz EMPIEZA la cifra', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 13.4}, {overlays:[st]});   // la voz dice la cifra a los 13.4s
    return cerca(st.conteo_s, 3.4, 0.01);                 // 13.4 - 10
  });

  check('autoSyncStat: acota (no deja conteos absurdos)', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 40}, {overlays:[st]});      // 30s: absurdo -> tope 6
    const alto = st.conteo_s;
    W.autoSyncStat({cifra_t0: 10.1}, {overlays:[st]});    // 0.1s: brusco -> suelo 0.8
    const bajo = st.conteo_s;
    return (alto === 6 && bajo === 0.8) ? true : `alto=${alto} bajo=${bajo}`;
  });

  check('autoSyncStat: sin cifra detectada NO toca nada', () => {
    const st = {escena:'stat', desde:()=>0, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: null}, {overlays:[st]});
    return st.conteo_s === 1.3 ? true : `lo cambió a ${st.conteo_s}`;
  });

  check('autoSyncStat: si la cifra se dice ANTES del stat, no toca nada', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 4}, {overlays:[st]});       // duración negativa -> ignorar
    return st.conteo_s === 1.3 ? true : `lo cambió a ${st.conteo_s}`;
  });

  // ── ZONAS SEGURAS: nada pisa la franja que tapan las plataformas ───────
  // (cazado a ojo en el housing: "YOU'RE NOT BEHIND" iba de x≈20 a 1057 -> los botones de Shorts
  //  se comen los 130 de la derecha. Un test lo caza siempre; mi ojo, solo a veces.)
  check('ningún Short pinta texto fuera de las zonas seguras', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    const S = {top:190, bottom:360, left:70, right:130};   // documentadas en el motor
    // las claves salen del <select> (SHORTS es const: invisible desde fuera)
    const sel = [...W.document.querySelectorAll('select')]
      .find(s => [...s.options].some(o => /^(s\d|fed|housing)/.test(o.value)));
    if (!sel) return 'no encontré el selector de Shorts';
    const shorts = [...sel.options].map(o => o.value);
    const malos = [];
    for (const k of shorts){
      sel.value = k; sel.dispatchEvent(new W.Event('change', {bubbles:true}));
      for (let t = 0.5; t < 32; t += 0.6){
        W.drawFrame(t);
        // franjas prohibidas: izquierda y derecha
        for (const [x0, w, lado] of [[0, S.left, 'izq'], [c.width - S.right, S.right, 'der']]){
          const d = cx.getImageData(x0, S.top, w, c.height - S.top - S.bottom).data;
          for (let i = 0; i < d.length; i += 4){
            // texto = píxel claro (el fondo verde oscuro nunca pasa de ~40)
            if (d[i] > 170 && d[i+1] > 170 && d[i+2] > 170){
              malos.push(`${k} t=${t.toFixed(1)} ${lado}`); i = d.length; break;
            }
          }
        }
        if (malos.length > 3) break;
      }
      if (malos.length > 3) break;
    }
    return malos.length === 0 ? true : `texto invadiendo: ${malos.slice(0,3).join(' · ')}`;
  });

  // ── DETERMINISMO de drawFrame (el export offline depende de esto) ──────
  check('drawFrame es DETERMINISTA (mismo t -> mismos píxeles)', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    W.drawFrame(1.0); const a = cx.getImageData(200, 900, 40, 40).data.join(',');
    W.drawFrame(5.0);
    W.drawFrame(1.0); const b = cx.getImageData(200, 900, 40, 40).data.join(',');
    return a === b ? true : 'los píxeles cambiaron entre dos llamadas al mismo t';
  });

  check('el fondo VIVE (t distinto -> fondo distinto)', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    W.drawFrame(1.0); const a = cx.getImageData(60, 60, 1, 1).data.join(',');
    W.drawFrame(5.0); const b = cx.getImageData(60, 60, 1, 1).data.join(',');
    return a !== b ? true : 'el drift del glow no se mueve';
  });

  // ── SERIE COMPUESTA: capital inicial + compuesto anual (Buffett) sin romper el S3 ──
  // series() cierra sobre CFG. cargarShort la reasigna -> W.series() da la del Short activo.
  check('series(): el S3 (publicado) NO se movió ni un céntimo tras añadir lump/annual', () => {
    W.cargarShort('s3-stat');                 // síncrono: fija SHORT/CFG/D
    const s = W.series();
    // pmt 500 · 30 años · 7% mensual: valores CONGELADOS (el S3 está en la calle)
    return (s.n === 360 && Math.abs(s.finalContrib - 180000) < 0.5
            && Math.abs(s.finalTotal - 609985.5) < 0.5 && Math.abs(s.gap - 429985.5) < 0.5)
      ? true : `S3 cambió: total=${s.finalTotal} contrib=${s.finalContrib} gap=${s.gap} n=${s.n}`;
  });

  check('series(): el Buffett reproduce la carta de Berkshire ($100 en 1965 -> ~$5.5M)', () => {
    W.cargarShort('buffett-time');
    const s = W.series();
    // lump 100 · 60 años · 19,9525% anual, sub-muestreado a MESES (n=720) con tasa mensual
    // equivalente -> curva fluida, MISMO final al céntimo. contrib PLANO en 100.
    const ok = (s.n === 720 && s.finalContrib === 100 && Math.abs(s.finalTotal - 5502477) < 2000);
    W.cargarShort('s3-stat');                 // deja el motor como estaba para los tests siguientes
    return ok ? true : `Buffett mal: total=${s.finalTotal} contrib=${s.finalContrib} n=${s.n}`;
  });

  // ── SUBTÍTULOS: cada frase ancla a SU bloque de voz (no se adelanta al silencio) ──
  // Regresión: el usuario notó subtítulos por delante de la voz. Causa: el reparto a ritmo global
  // metía la 1ª palabra de una frase en el silencio anterior. Ahora, si nº frases == nº bloques,
  // cada frase arranca en el inicio real de su bloque.
  check('alinearPalabras: la 2ª frase arranca en su bloque, no en el silencio previo', () => {
    const segs = [[0.0, 1.0], [1.5, 2.5]];             // 2 bloques con un hueco 1.0-1.5
    const ws = W.alinearPalabras('One two three. Four five six.', segs);
    const four = ws.find(w => w.w.replace(/[^A-Za-z]/g,'') === 'Four');
    if (!four) return 'no encontró Four';
    if (Math.abs(four.t0 - 1.5) > 0.02) return `Four en ${four.t0.toFixed(2)}, esperaba 1.50`;
    const enHueco = ws.filter(w => w.t0 > 1.02 && w.t0 < 1.48);
    return enHueco.length === 0 ? true : `palabras en el silencio: ${enHueco.map(w=>w.w).join(',')}`;
  });

  // ── MUXER MP4: estructura válida sin concatenar en RAM (crash "al 80%") ──
  // Un Short largo (48s a 24Mbps ~144MB) moría al muxear porque se concatenaba 3x (~576MB).
  // Ahora el Blob toma los trozos directamente; este test fija que los offsets siguen cuadrando.
  check('muxMP4: cajas ftyp|mdat|moov y el mdat mide cabecera+video+audio', async () => {
    const mk = (n, f) => { const b = new Uint8Array(n); b.fill(f); return b; };
    const v = {trozos:[mk(10,1),mk(20,2),mk(30,3)], tamanos:[10,20,30], claves:[1],
               desc:new Uint8Array([0,1,2,3]), w:1080, h:1920};
    const a = {trozos:[mk(5,7),mk(7,8)], tamanos:[5,7], desc:new Uint8Array([9,9]), sr:48000, ch:2};
    const buf = new Uint8Array(await W.muxMP4(v, a).arrayBuffer());
    const be32 = o => (buf[o]<<24|buf[o+1]<<16|buf[o+2]<<8|buf[o+3])>>>0;
    const typ = o => String.fromCharCode(buf[o+4],buf[o+5],buf[o+6],buf[o+7]);
    const cajas = []; let o=0; while(o<buf.length){const sz=be32(o);cajas.push([typ(o),sz,o]);if(sz<=0)break;o+=sz;}
    const orden = cajas.map(c=>c[0]).join(',');
    if (orden !== 'ftyp,mdat,moov') return `cajas ${orden}`;
    const mdat = cajas.find(c=>c[0]==='mdat');
    if (mdat[1] !== 8+60+12) return `mdat ${mdat[1]}, esperaba ${8+60+12}`;
    if (buf[mdat[2]+8] !== 1) return 'el video no empieza en mdat+8';
    const offA = cajas[0][1] + 8 + 60;                 // ftyp + cabecera mdat + tamVideo
    if (buf[offA] !== 7) return 'el audio no empieza en offV+tamVideo';
    return true;
  });

  // ── STAT con decimales (retrocompatibilidad) ──────────────────────────
  check('construirMezcla: no clippea con la voz + sfx', () => {
    const N = voz.length;
    const mix = W.construirMezcla(voz, 1, N, {beats:[1,2], ticks:[0.5], risers:[2], hits:[3]});
    let mx=0; for (const v of mix[0]) mx = Math.max(mx, Math.abs(v));
    return mx <= 0.95 ? true : `pico ${mx.toFixed(3)}`;
  });

  await Promise.all(pendientes);              // espera los tests async (p.ej. el muxer lee el Blob)
  const res = document.getElementById('res');
  res.textContent = fail === 0 ? `✅ ${pass} tests PASAN` : `❌ ${fail} FALLAN de ${pass+fail}`;
  res.className = fail === 0 ? 'ok' : 'bad';
};
</script>
</body>
</html>
