<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tests del motor de Shorts — Net Worthy</title>
<style>
  body{background:#0A1A14;color:#F4F6F3;font:15px/1.5 system-ui,sans-serif;margin:0;padding:28px 24px;max-width:900px}
  h1{color:#D8B25A;font-size:20px;margin:0 0 4px}
  .sub{color:#5C6E64;margin:0 0 20px}
  #res{font-weight:800;font-size:18px;padding:10px 14px;border-radius:8px;display:inline-block;margin-bottom:16px}
  .ok{background:#123}  .bad{background:#3a1a1a}
  .t{padding:7px 10px;border-bottom:1px solid #16261f;display:flex;gap:10px;align-items:baseline}
  .p{color:#1F9E6E;font-weight:700} .f{color:#C0968C;font-weight:700}
  .n{flex:1} .d{color:#5C6E64;font-size:13px}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none}
</style>
</head>
<body>
<h1>Tests del motor de Shorts</h1>
<p class="sub">Verifica la lógica PURA del renderizador (audio, calibración, eventos, determinismo).
  Sin dependencias: carga <code>short-renderer.html</code> en un iframe y comprueba sus funciones.
  <strong>Sírvelo por http://localhost:8765</strong> (desde file:// el iframe se bloquea).</p>
<div id="res">corriendo…</div>
<div id="out"></div>
<iframe id="motor" src="short-renderer.html"></iframe>

<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;

function check(nombre, fn){
  let okv, detalle = '';
  try { const r = fn(); okv = r === true; if (!okv) detalle = String(r); }
  catch (e){ okv = false; detalle = 'EXCEPCIÓN: ' + e.message; }
  okv ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 't';
  d.innerHTML = `<span class="${okv?'p':'f'}">${okv?'PASA':'FALLA'}</span>` +
                `<span class="n">${nombre}</span><span class="d">${detalle}</span>`;
  out.appendChild(d);
}
const cerca = (a, b, tol) => Math.abs(a-b) <= tol ? true : `esperaba ~${b} (±${tol}), dio ${a}`;

document.getElementById('motor').onload = () => {
  const W = document.getElementById('motor').contentWindow;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const SR = 48000;

  // helpers: buffers sintéticos con nivel conocido
  const buf = (dur, fn) => {
    const n = Math.floor(dur*SR), b = ctx.createBuffer(1, n, SR), d = b.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = fn(i/SR, i);
    return b;
  };
  const rms = b => { const d=b.getChannelData(0); let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i]; return Math.sqrt(s/d.length); };
  // voz sintética: habla la mitad del tiempo (simula los silencios de un TTS)
  const voz = buf(4, (t) => (t % 1) < 0.5 ? 0.5*Math.sin(2*Math.PI*220*t) : 0);
  const mus = buf(2, (t) => 0.3*Math.sin(2*Math.PI*440*t));

  // ── AUTO-GAIN de música ────────────────────────────────────────────────
  check('gainMusicaAuto existe y devuelve una ganancia acotada', () => {
    const g = W.gainMusicaAuto(voz, mus);
    return (g > 0.02 && g <= 0.5) ? true : `fuera de rango: ${g}`;
  });

  check('gainMusicaAuto es INDEPENDIENTE de la pista (fuerte y floja acaban igual)', () => {
    // niveles realistas (música normalizada de biblioteca): 4x de diferencia, dentro del rango útil
    const fuerte = buf(2, (t) => 0.60*Math.sin(2*Math.PI*440*t));
    const floja  = buf(2, (t) => 0.15*Math.sin(2*Math.PI*440*t));
    const nf = rms(fuerte) * W.gainMusicaAuto(voz, fuerte);
    const nl = rms(floja)  * W.gainMusicaAuto(voz, floja);
    return cerca(nf, nl, nl*0.10);   // mismo nivel percibido (±10%)
  });

  check('gainMusicaAuto: el TOPE de seguridad actúa con pistas patológicas', () => {
    // una pista casi muda pediría ganancia >1 (amplificar ruido): se acota en 0.5
    const casiMuda = buf(2, (t) => 0.01*Math.sin(2*Math.PI*440*t));
    const g = W.gainMusicaAuto(voz, casiMuda);
    return g === 0.5 ? true : `esperaba el tope 0.5, dio ${g}`;
  });

  check('gainMusicaAuto mide la voz SOLO donde habla (los silencios no la hunden)', () => {
    // misma voz pero con el doble de silencio: la ganancia NO debe cambiar apenas
    const vozMasSilencio = buf(8, (t) => (t % 2) < 0.5 ? 0.5*Math.sin(2*Math.PI*220*t) : 0);
    const a = W.gainMusicaAuto(voz, mus), b = W.gainMusicaAuto(vozMasSilencio, mus);
    return cerca(b, a, a*0.15);
  });

  // ── MEZCLA de música (ducking) ─────────────────────────────────────────
  check('mezclarMusica: no clippea nunca', () => {
    const N = voz.length;
    const canal = new Float32Array(N); canal.set(voz.getChannelData(0));
    const mix = W.mezclarMusica([canal], mus, N, SR, {gain:0.4});
    let mx=0; for (const v of mix[0]) mx = Math.max(mx, Math.abs(v));
    return mx <= 0.97 ? true : `pico ${mx.toFixed(3)} > 0.97`;
  });

  check('mezclarMusica: la voz AGACHA la música (ducking sidechain)', () => {
    const N = voz.length;
    const canal = new Float32Array(N); canal.set(voz.getChannelData(0));
    const mix = W.mezclarMusica([canal], mus, N, SR, {gain:0.3, fadeIn:0.05, fadeOut:0.05});
    const o = mix[0], v = canal;
    // aporte de la música donde HAY voz vs donde NO hay
    const aporte = (i0,i1) => { let s=0,n=0; for(let i=i0;i<i1;i++){ s+=Math.abs(o[i]-v[i]); n++; } return s/n; };
    const conVoz = aporte(Math.floor(0.1*SR), Math.floor(0.4*SR));   // habla
    const sinVoz = aporte(Math.floor(0.6*SR), Math.floor(0.9*SR));   // silencio
    return sinVoz > conVoz*1.5 ? true : `sin voz ${sinVoz.toFixed(4)} debería superar a con voz ${conVoz.toFixed(4)}`;
  });

  // ── DISEÑO DE SONIDO por eventos ───────────────────────────────────────
  check('eventosSonido deriva los ticks de los bullets y el hit del stat', () => {
    const t = {hook:2, curve:10, cta:20};
    const cfg = { overlays: [
      {escena:'bullets', desde:2, cadencia_s:2, items:['a','b','c']},
      {escena:'stat', desde:()=>t.curve, conteo_s:1.5},
    ]};
    const ev = W.eventosSonido(cfg, t);
    const ticksOk = JSON.stringify(ev.ticks) === JSON.stringify([2.35, 4.35, 6.35]);
    const hitOk = ev.hits.length===1 && Math.abs(ev.hits[0]-11.5) < 0.01;
    const riserOk = ev.risers.length===1 && Math.abs(ev.risers[0]-10) < 0.01;
    return (ticksOk && hitOk && riserOk) ? true : `ticks=${ev.ticks} hits=${ev.hits} risers=${ev.risers}`;
  });

  // ── AUTO-SYNC del stat ─────────────────────────────────────────────────
  check('autoSyncStat: el conteo termina cuando la voz EMPIEZA la cifra', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 13.4}, {overlays:[st]});   // la voz dice la cifra a los 13.4s
    return cerca(st.conteo_s, 3.4, 0.01);                 // 13.4 - 10
  });

  check('autoSyncStat: acota (no deja conteos absurdos)', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 40}, {overlays:[st]});      // 30s: absurdo -> tope 6
    const alto = st.conteo_s;
    W.autoSyncStat({cifra_t0: 10.1}, {overlays:[st]});    // 0.1s: brusco -> suelo 0.8
    const bajo = st.conteo_s;
    return (alto === 6 && bajo === 0.8) ? true : `alto=${alto} bajo=${bajo}`;
  });

  check('autoSyncStat: sin cifra detectada NO toca nada', () => {
    const st = {escena:'stat', desde:()=>0, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: null}, {overlays:[st]});
    return st.conteo_s === 1.3 ? true : `lo cambió a ${st.conteo_s}`;
  });

  check('autoSyncStat: si la cifra se dice ANTES del stat, no toca nada', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 4}, {overlays:[st]});       // duración negativa -> ignorar
    return st.conteo_s === 1.3 ? true : `lo cambió a ${st.conteo_s}`;
  });

  // ── DETERMINISMO de drawFrame (el export offline depende de esto) ──────
  check('drawFrame es DETERMINISTA (mismo t -> mismos píxeles)', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    W.drawFrame(1.0); const a = cx.getImageData(200, 900, 40, 40).data.join(',');
    W.drawFrame(5.0);
    W.drawFrame(1.0); const b = cx.getImageData(200, 900, 40, 40).data.join(',');
    return a === b ? true : 'los píxeles cambiaron entre dos llamadas al mismo t';
  });

  check('el fondo VIVE (t distinto -> fondo distinto)', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    W.drawFrame(1.0); const a = cx.getImageData(60, 60, 1, 1).data.join(',');
    W.drawFrame(5.0); const b = cx.getImageData(60, 60, 1, 1).data.join(',');
    return a !== b ? true : 'el drift del glow no se mueve';
  });

  // ── STAT con decimales (retrocompatibilidad) ──────────────────────────
  check('construirMezcla: no clippea con la voz + sfx', () => {
    const N = voz.length;
    const mix = W.construirMezcla(voz, 1, N, {beats:[1,2], ticks:[0.5], risers:[2], hits:[3]});
    let mx=0; for (const v of mix[0]) mx = Math.max(mx, Math.abs(v));
    return mx <= 0.95 ? true : `pico ${mx.toFixed(3)}`;
  });

  const res = document.getElementById('res');
  res.textContent = fail === 0 ? `✅ ${pass} tests PASAN` : `❌ ${fail} FALLAN de ${pass+fail}`;
  res.className = fail === 0 ? 'ok' : 'bad';
};
</script>
</body>
</html>
