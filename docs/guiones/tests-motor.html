<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tests del motor de Shorts — Net Worthy</title>
<style>
  body{background:#0A1A14;color:#F4F6F3;font:15px/1.5 system-ui,sans-serif;margin:0;padding:28px 24px;max-width:900px}
  h1{color:#D8B25A;font-size:20px;margin:0 0 4px}
  .sub{color:#5C6E64;margin:0 0 20px}
  #res{font-weight:800;font-size:18px;padding:10px 14px;border-radius:8px;display:inline-block;margin-bottom:16px}
  .ok{background:#123}  .bad{background:#3a1a1a}
  .t{padding:7px 10px;border-bottom:1px solid #16261f;display:flex;gap:10px;align-items:baseline}
  .p{color:#1F9E6E;font-weight:700} .f{color:#C0968C;font-weight:700}
  .n{flex:1} .d{color:#5C6E64;font-size:13px}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none}
</style>
</head>
<body>
<h1>Tests del motor de Shorts</h1>
<p class="sub">Verifica la lógica PURA del renderizador (audio, calibración, eventos, determinismo).
  Sin dependencias: carga <code>short-renderer.html</code> en un iframe y comprueba sus funciones.
  <strong>Sírvelo por http://localhost:8765</strong> (desde file:// el iframe se bloquea).</p>
<div id="res">corriendo…</div>
<div id="out"></div>
<!-- SIN src: se asigna por JS con cache-bust. Con `src` fijo el navegador servía el motor de su
     caché y los tests podían estar validando una versión ANTERIOR a la que se acababa de editar —
     un "32 tests PASAN" sobre código viejo. Pasó de verdad el 2026-07-26. -->
<iframe id="motor"></iframe>

<script>
const out = document.getElementById('out');
let pass = 0, fail = 0;
const pendientes = [];               // tests async: se esperan antes del resumen

function pinta(nombre, okv, detalle){
  okv ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = 't';
  d.innerHTML = `<span class="${okv?'p':'f'}">${okv?'PASA':'FALLA'}</span>` +
                `<span class="n">${nombre}</span><span class="d">${detalle}</span>`;
  out.appendChild(d);
}
// fn puede ser síncrona (devuelve true|detalle) o async (Promise de lo mismo).
function check(nombre, fn){
  try {
    const r = fn();
    if (r && typeof r.then === 'function'){
      pendientes.push(r.then(v => pinta(nombre, v === true, v === true ? '' : String(v)))
                       .catch(e => pinta(nombre, false, 'EXCEPCIÓN: ' + e.message)));
      return;
    }
    pinta(nombre, r === true, r === true ? '' : String(r));
  } catch (e){ pinta(nombre, false, 'EXCEPCIÓN: ' + e.message); }
}
const cerca = (a, b, tol) => Math.abs(a-b) <= tol ? true : `esperaba ~${b} (±${tol}), dio ${a}`;

document.getElementById('motor').onload = async () => {
  const W = document.getElementById('motor').contentWindow;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const SR = 48000;

  // helpers: buffers sintéticos con nivel conocido
  const buf = (dur, fn) => {
    const n = Math.floor(dur*SR), b = ctx.createBuffer(1, n, SR), d = b.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = fn(i/SR, i);
    return b;
  };
  const rms = b => { const d=b.getChannelData(0); let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i]; return Math.sqrt(s/d.length); };
  // voz sintética: habla la mitad del tiempo (simula los silencios de un TTS)
  const voz = buf(4, (t) => (t % 1) < 0.5 ? 0.5*Math.sin(2*Math.PI*220*t) : 0);
  const mus = buf(2, (t) => 0.3*Math.sin(2*Math.PI*440*t));

  // ── AUTO-GAIN de música ────────────────────────────────────────────────
  check('gainMusicaAuto existe y devuelve una ganancia acotada', () => {
    const g = W.gainMusicaAuto(voz, mus);
    return (g > 0.02 && g <= 0.5) ? true : `fuera de rango: ${g}`;
  });

  check('gainMusicaAuto es INDEPENDIENTE de la pista (fuerte y floja acaban igual)', () => {
    // niveles realistas (música normalizada de biblioteca): 4x de diferencia, dentro del rango útil
    const fuerte = buf(2, (t) => 0.60*Math.sin(2*Math.PI*440*t));
    const floja  = buf(2, (t) => 0.15*Math.sin(2*Math.PI*440*t));
    const nf = rms(fuerte) * W.gainMusicaAuto(voz, fuerte);
    const nl = rms(floja)  * W.gainMusicaAuto(voz, floja);
    return cerca(nf, nl, nl*0.10);   // mismo nivel percibido (±10%)
  });

  check('gainMusicaAuto: el TOPE de seguridad actúa con pistas patológicas', () => {
    // una pista casi muda pediría ganancia >1 (amplificar ruido): se acota en 0.5
    const casiMuda = buf(2, (t) => 0.01*Math.sin(2*Math.PI*440*t));
    const g = W.gainMusicaAuto(voz, casiMuda);
    return g === 0.5 ? true : `esperaba el tope 0.5, dio ${g}`;
  });

  check('gainMusicaAuto mide la voz SOLO donde habla (los silencios no la hunden)', () => {
    // misma voz pero con el doble de silencio: la ganancia NO debe cambiar apenas
    const vozMasSilencio = buf(8, (t) => (t % 2) < 0.5 ? 0.5*Math.sin(2*Math.PI*220*t) : 0);
    const a = W.gainMusicaAuto(voz, mus), b = W.gainMusicaAuto(vozMasSilencio, mus);
    return cerca(b, a, a*0.15);
  });

  // ── MEZCLA de música (ducking) ─────────────────────────────────────────
  check('mezclarMusica: no clippea nunca', () => {
    const N = voz.length;
    const canal = new Float32Array(N); canal.set(voz.getChannelData(0));
    const mix = W.mezclarMusica([canal], mus, N, SR, {gain:0.4});
    let mx=0; for (const v of mix[0]) mx = Math.max(mx, Math.abs(v));
    return mx <= 0.97 ? true : `pico ${mx.toFixed(3)} > 0.97`;
  });

  check('mezclarMusica: la voz AGACHA la música (ducking sidechain)', () => {
    const N = voz.length;
    const canal = new Float32Array(N); canal.set(voz.getChannelData(0));
    const mix = W.mezclarMusica([canal], mus, N, SR, {gain:0.3, fadeIn:0.05, fadeOut:0.05});
    const o = mix[0], v = canal;
    // aporte de la música donde HAY voz vs donde NO hay
    const aporte = (i0,i1) => { let s=0,n=0; for(let i=i0;i<i1;i++){ s+=Math.abs(o[i]-v[i]); n++; } return s/n; };
    const conVoz = aporte(Math.floor(0.1*SR), Math.floor(0.4*SR));   // habla
    const sinVoz = aporte(Math.floor(0.6*SR), Math.floor(0.9*SR));   // silencio
    return sinVoz > conVoz*1.5 ? true : `sin voz ${sinVoz.toFixed(4)} debería superar a con voz ${conVoz.toFixed(4)}`;
  });

  // ── DISEÑO DE SONIDO por eventos ───────────────────────────────────────
  check('eventosSonido deriva los ticks de los bullets y el hit del stat', () => {
    const t = {hook:2, curve:10, cta:20};
    const cfg = { overlays: [
      {escena:'bullets', desde:2, cadencia_s:2, items:['a','b','c']},
      {escena:'stat', desde:()=>t.curve, conteo_s:1.5},
    ]};
    const ev = W.eventosSonido(cfg, t);
    const ticksOk = JSON.stringify(ev.ticks) === JSON.stringify([2.35, 4.35, 6.35]);
    const hitOk = ev.hits.length===1 && Math.abs(ev.hits[0]-11.5) < 0.01;
    const riserOk = ev.risers.length===1 && Math.abs(ev.risers[0]-10) < 0.01;
    return (ticksOk && hitOk && riserOk) ? true : `ticks=${ev.ticks} hits=${ev.hits} risers=${ev.risers}`;
  });

  // ── CADENCIA de bullets (anti pantalla-congelada) ──────────────────────
  check('cadenciaBullets: si el Short la fija, manda', () => {
    return W.cadenciaBullets({cadencia_s:2.6, desde:0, hasta:13, items:['a','b','c']}) === 2.6
      ? true : 'ignoró la cadencia explícita';
  });

  // el test flojo (50-90%) dejó pasar un off-by-one que dejaba 6.4s muertos: ahora exige 68-85%
  check('cadenciaBullets: el ÚLTIMO item entra al 68-85% del tramo (mata el hold muerto)', () => {
    const casos = [ {win:13, n:3}, {win:18, n:3}, {win:9, n:4}, {win:20, n:5} ];
    for (const {win, n} of casos){
      const items = Array.from({length:n}, (_,i)=>'x'+i);
      const cad = W.cadenciaBullets({desde:2, hasta:2+win, items});
      const frac = (0.35 + (n-1)*cad) / win;
      if (frac < 0.68 || frac > 0.85)
        return `win=${win} n=${n}: el último entra al ${(frac*100).toFixed(0)}% (fuera de 68-85%)`;
    }
    return true;
  });

  check('cadenciaBullets: acepta desde/hasta como funciones', () => {
    const cad = W.cadenciaBullets({desde:()=>2, hasta:()=>15, items:['a','b','c']});
    return cad > 0.6 ? true : `dio ${cad}`;
  });

  check('cadenciaBullets: ventana inválida o 1 solo item -> default seguro', () => {
    const neg = W.cadenciaBullets({desde:10, hasta:2, items:['a','b']});
    const uno = W.cadenciaBullets({desde:0, hasta:10, items:['a']});   // n-1 = 0: no dividir por cero
    return (neg === 1.6 && uno === 1.6) ? true : `neg=${neg} uno=${uno}`;
  });

  // ── AUTO-SYNC del stat ─────────────────────────────────────────────────
  check('autoSyncStat: el conteo termina cuando la voz EMPIEZA la cifra', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 13.4}, {overlays:[st]});   // la voz dice la cifra a los 13.4s
    return cerca(st.conteo_s, 3.4, 0.01);                 // 13.4 - 10
  });

  check('autoSyncStat: acota (no deja conteos absurdos)', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 40}, {overlays:[st]});      // 30s: absurdo -> tope 6
    const alto = st.conteo_s;
    W.autoSyncStat({cifra_t0: 10.1}, {overlays:[st]});    // 0.1s: brusco -> suelo 0.8
    const bajo = st.conteo_s;
    return (alto === 6 && bajo === 0.8) ? true : `alto=${alto} bajo=${bajo}`;
  });

  check('autoSyncStat: sin cifra detectada NO toca nada', () => {
    const st = {escena:'stat', desde:()=>0, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: null}, {overlays:[st]});
    return st.conteo_s === 1.3 ? true : `lo cambió a ${st.conteo_s}`;
  });

  check('autoSyncStat: si la cifra se dice ANTES del stat, no toca nada', () => {
    const st = {escena:'stat', desde:()=>10, conteo_s:1.3};
    W.autoSyncStat({cifra_t0: 4}, {overlays:[st]});       // duración negativa -> ignorar
    return st.conteo_s === 1.3 ? true : `lo cambió a ${st.conteo_s}`;
  });

  // ── ZONAS SEGURAS: nada pisa la franja que tapan las plataformas ───────
  // (cazado a ojo en el housing: "YOU'RE NOT BEHIND" iba de x≈20 a 1057 -> los botones de Shorts
  //  se comen los 130 de la derecha. Un test lo caza siempre; mi ojo, solo a veces.)
  check('ningún Short pinta texto fuera de las zonas seguras', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    const S = {top:190, bottom:360, left:70, right:130};   // documentadas en el motor
    // las claves salen del <select> (SHORTS es const: invisible desde fuera)
    const sel = [...W.document.querySelectorAll('select')]
      .find(s => [...s.options].some(o => /^(s\d|fed|housing)/.test(o.value)));
    if (!sel) return 'no encontré el selector de Shorts';
    const shorts = [...sel.options].map(o => o.value);
    const malos = [];
    for (const k of shorts){
      sel.value = k; sel.dispatchEvent(new W.Event('change', {bubbles:true}));
      for (let t = 0.5; t < 32; t += 0.6){
        W.drawFrame(t);
        // franjas prohibidas: izquierda y derecha
        for (const [x0, w, lado] of [[0, S.left, 'izq'], [c.width - S.right, S.right, 'der']]){
          const d = cx.getImageData(x0, S.top, w, c.height - S.top - S.bottom).data;
          for (let i = 0; i < d.length; i += 4){
            // texto = píxel claro (el fondo verde oscuro nunca pasa de ~40)
            if (d[i] > 170 && d[i+1] > 170 && d[i+2] > 170){
              malos.push(`${k} t=${t.toFixed(1)} ${lado}`); i = d.length; break;
            }
          }
        }
        if (malos.length > 3) break;
      }
      if (malos.length > 3) break;
    }
    return malos.length === 0 ? true : `texto invadiendo: ${malos.slice(0,3).join(' · ')}`;
  });

  // ── DETERMINISMO de drawFrame (el export offline depende de esto) ──────
  check('drawFrame es DETERMINISTA (mismo t -> mismos píxeles)', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    W.drawFrame(1.0); const a = cx.getImageData(200, 900, 40, 40).data.join(',');
    W.drawFrame(5.0);
    W.drawFrame(1.0); const b = cx.getImageData(200, 900, 40, 40).data.join(',');
    return a === b ? true : 'los píxeles cambiaron entre dos llamadas al mismo t';
  });

  // Antes miraba UN píxel en (60,60) —una esquina donde el resplandor casi no llega— y pasaba por
  // un accidente de redondeo: la diferencia era de 1/255 en un canal, imperceptible. Al subir el
  // brillo de la base con el grado de color, ese bit se perdió y el test cayó aunque el fondo
  // seguía moviéndose. Ahora mide una REGIÓN de la zona iluminada y exige una diferencia media
  // por encima de un piso: afirma lo que decía afirmar.
  check('el fondo VIVE (t distinto -> fondo distinto)', () => {
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d', {willReadFrequently:true});
    const zona = (t) => { W.drawFrame(t); return cx.getImageData(c.width*0.5 - 60, c.height*0.40, 120, 80).data; };
    const a = zona(1.0), b = zona(5.0);
    let dif = 0;
    for (let i = 0; i < a.length; i += 4)
      dif += Math.abs(a[i]-b[i]) + Math.abs(a[i+1]-b[i+1]) + Math.abs(a[i+2]-b[i+2]);
    const media = dif / (a.length/4*3);
    return media > 0.25 ? true
      : `el drift del glow no se mueve: diferencia media ${media.toFixed(3)} entre t=1 y t=5`;
  });

  // ── MOTION BUDGET v1 — enforcement de docs/EXPERIMENTO-RITMO.md §5 ─────
  // "La regla vive en un test verde, no en la buena intención." Barre el timeline y asevera que
  // ningún intervalo de QUIETUD supera el presupuesto de su ventana. Sin esto, si el Experimento
  // #001 sale mal no se puede distinguir "la hipótesis era falsa" de "el render no aplicó ritmo"
  // — que es justo el agujero que hoy dejó 4 predicciones inverificables.
  //
  // Firma barata: el frame reducido a 64x114. Leer 1080x1920x4 por frame serían ~8MB x200.
  const _firma = (() => {
    const small = document.createElement('canvas');
    small.width = 64; small.height = 114;
    const sctx = small.getContext('2d', {willReadFrequently: true});
    return (cnv) => { sctx.drawImage(cnv, 0, 0, small.width, small.height);
                      return sctx.getImageData(0, 0, small.width, small.height).data; };
  })();
  const _difMedia = (a, b) => {           // diferencia media por canal, escala 0-255
    let s = 0;
    for (let i = 0; i < a.length; i += 4)
      s += Math.abs(a[i]-b[i]) + Math.abs(a[i+1]-b[i+1]) + Math.abs(a[i+2]-b[i+2]);
    return s / (a.length / 4 * 3);
  };
  // FIN se toma del Short activo, no de una constante. Con 52 hardcodeado el barrido medía hasta
  // 20s MÁS ALLÁ del final del vídeo (en los tests no hay voz cargada, así que el reloj es el
  // prestado de ~24s) y ahí, lógicamente, no pasa nada: el presupuesto fallaba por un motivo falso.
  const DT = 0.25;
  const finDe = () => Math.max(4, (W.duracionActiva ? W.duracionActiva() : 52) - 0.5);
  // Un barrido son ~209 drawFrame sobre un canvas 1080x1920: se cachea por Short o el test
  // tardaría un minuto (y un test lento se deja de correr).
  const _cacheSigs = {};
  const _sigsDe = (short) => {
    if (_cacheSigs[short]) return _cacheSigs[short];
    W.cargarShort(short);                                  // síncrono: fija SHORT/CFG/D
    const c = W.document.querySelector('canvas');
    const sigs = [];
    const fin = finDe();
    for (let i = 0; i * DT <= fin; i++){ W.drawFrame(i * DT); sigs.push(_firma(c)); }
    return (_cacheSigs[short] = sigs);
  };
  // Devuelve, para una ventana, el intervalo MÁS QUIETO: la menor diferencia entre dos frames
  // separados por el presupuesto de congelado. Si eso es ~0, el cuadro estuvo congelado.
  const _masQuieto = (short, desde, hasta, frozen) => {
    const sigs = _sigsDe(short);
    const salto = Math.round(frozen / DT);
    let peor = Infinity, peorT = -1;
    for (let t = desde; t + frozen <= hasta; t += DT){
      const i = Math.round(t / DT);
      if (!sigs[i] || !sigs[i + salto]) continue;
      const d = _difMedia(sigs[i], sigs[i + salto]);
      if (d < peor){ peor = d; peorT = t; }
    }
    return {peor, peorT};
  };

  // Presupuesto por ventana (EXPERIMENTO-RITMO.md §4). HOOK dice "nunca frozen": se exige
  // movimiento en medio segundo, que es el micro-movimiento continuo que el diseño promete.
  //
  // BODY pasó a `exige:true` el 2026-07-25 al implementarse su budget (antes NUNCA existió: los
  // cuatro Shorts congelaban >=2.5s en el cuerpo, 0.013-0.024, nivel pixel-idéntico).
  const VENTANAS = [
    {nombre: 'HOOK 0-2s',        desde: 0,  hasta: 2,   frozen: 0.5, exige: true},
    {nombre: 'ACANTILADO 2-10s', desde: 2,  hasta: 10,  frozen: 1.5, exige: true},
    {nombre: 'BODY 10s-fin',     desde: 10, hasta: finDe(), frozen: 2.5, exige: true},
  ];

  // EPS CALIBRADO CON DATOS (2026-07-25), no elegido a ojo. La escala se separa en tres niveles
  // al medir los 4 Shorts (diferencia media por canal, 0-255, sobre el frame reducido a 64x114):
  //   CONGELADO           0.00-0.06   s1/fed HOOK = 0.00 · s3 HOOK = 0.02 · fed ACANTILADO = 0.022
  //   MICRO-MOVIMIENTO    0.11-0.17   buffett HOOK = 0.112 (el `breath` del ritmo: escala ±0.6%)
  //   BEAT REAL           0.70+       buffett ACANTILADO = 0.736 · s1 = 0.778
  // 0.10 es el corte que separa congelado de micro-movimiento. El primer valor que probé (0.5)
  // caía DENTRO del rango de beat real y reprobaba movimiento que sí existe.
  // Subir la resolución no cambia el veredicto (probado a 114/228/456/912px: HOOK se estabiliza
  // en ~0.2 y BODY en ~0.02), así que 64x114 basta y es 200x más barato.
  const EPS = 0.10;

  // Cubre TODOS los Shorts con ritmo, no solo el Buffett: la lista la da el motor
  // (`shortsConRitmo`) en vez de estar hardcodeada, que se desincronizaría al añadir uno nuevo
  // y dejaría el test verde sin cubrirlo.
  check('MOTION BUDGET: ningún Short con ritmo se congela más de lo permitido en ninguna ventana', () => {
    const claves = W.shortsConRitmo ? W.shortsConRitmo() : ['buffett-time'];
    if (!claves.length) return 'ningún Short declara `ritmo`: el Motion Budget no cubre nada';
    const malos = [];
    for (const key of claves){
      const medidas = [];
      for (const v of VENTANAS){
        const {peor, peorT} = _masQuieto(key, v.desde, v.hasta, v.frozen);
        if (peor === Infinity) continue;
        medidas.push(`${v.nombre} min=${peor.toFixed(3)}`);
        if (v.exige && peor < EPS)
          malos.push(`${key} ${v.nombre}: congelado ${v.frozen}s desde t=${peorT.toFixed(2)} (diff ${peor.toFixed(3)})`);
      }
      console.log(`[MOTION BUDGET] ${key} →`, medidas.join(' | '));
    }
    return malos.length === 0 ? true : malos.join(' · ');
  });

  // El micro-movimiento debe ser CONTINUO, no un parpadeo: §4 pone un TECHO explícito
  // ("no estroboscopio"). Se compara el salto máximo entre frames consecutivos de un Short CON
  // ritmo contra uno SIN ritmo: si el ritmo introdujera parpadeo, su salto se dispararía.
  check('MOTION BUDGET: el ritmo no introduce estroboscopio (techo de §4)', () => {
    const salto = key => {
      const sigs = _sigsDe(key);
      let max = 0;
      for (let i = 40; i < sigs.length - 1; i++) max = Math.max(max, _difMedia(sigs[i], sigs[i+1]));
      return max;
    };
    const conRitmo = salto('buffett-time'), sinRitmo = salto('s3-stat');
    console.log(`[MOTION BUDGET] salto max entre frames → buffett=${conRitmo.toFixed(2)} vs s3=${sinRitmo.toFixed(2)}`);
    return conRitmo <= sinRitmo * 1.5 ? true
      : `el Short con ritmo salta ${conRitmo.toFixed(2)} entre frames contra ${sinRitmo.toFixed(2)} ` +
        `del que no lo lleva: eso ya no es micro-movimiento continuo, es parpadeo.`;
  });

  // El FED es el peor Short del canal (10 espectadores) y docs/ESTADO.md ya anotaba "tenía además
  // 8s congelados" como confounder. Este barrido lo detecta SOLO: 0.022 en el acantilado, nivel
  // de congelado. Es la mejor prueba de que la métrica mide algo real y no ruido.
  check('MOTION BUDGET: el barrido detecta el congelado documentado del FED', () => {
    const {peor} = _masQuieto('fed-catchup', 2, 10, 1.5);
    console.log(`[MOTION BUDGET] fed-catchup acantilado → ${peor.toFixed(3)}`);
    return peor < EPS ? true
      : `el FED debería salir congelado en 2-10s (docs/ESTADO.md: "8s congelados") y mide ` +
        `${peor.toFixed(3)}, por encima del umbral ${EPS}. O el motor cambió, o la métrica dejó ` +
        `de detectar congelados.`;
  });

  // CONTROL NEGATIVO: un test que no puede fallar no es un test. Si el barrido no distingue un
  // Short SIN ritmo de uno CON ritmo, el de arriba pasa siempre y no prueba nada.
  check('MOTION BUDGET: el barrido DISCRIMINA (el S3 sin ritmo se queda más quieto que el Buffett)', () => {
    const conRitmo = _masQuieto('buffett-time', 2, 10, 1.5).peor;
    const sinRitmo = _masQuieto('s3-stat',      2, 10, 1.5).peor;
    console.log(`[MOTION BUDGET] discriminación → s3-stat=${sinRitmo.toFixed(2)} vs buffett=${conRitmo.toFixed(2)}`);
    return sinRitmo < conRitmo ? true
      : `el barrido NO discrimina: s3-stat (sin ritmo) mide ${sinRitmo.toFixed(2)} y buffett ` +
        `(con ritmo) ${conRitmo.toFixed(2)}. Con este instrumento el test de arriba no prueba nada.`;
  });

  // Bug real del 2026-07-25 (Read #7): la cifra de `curvaLlegaEn` se decía DOS veces en el guion
  // ("eight million dollars" en `intro` y en `proof`). El calibrador usa `.find()`, cogió la
  // primera, y el contador de un video de 62s terminaba a los 7.15s y se quedaba clavado 55
  // segundos. No lo detectaba nada: no rompe, solo cuenta mal la historia.
  check('CALIBRADOR: si la cifra de la curva se repite, el Short DEBE acotar el grupo', () => {
    const claves = [...W.document.getElementById('short').options].map(o => o.value);
    const malos = [];
    for (const k of claves){
      W.cargarShort(k);
      const g = W.guionActivo ? W.guionActivo() : null;
      if (!g || !g.curvaLlegaEn) continue;
      const hablada = (g.cifras || []).filter(c => c[1] === g.curvaLlegaEn).map(c => c[0]);
      const txt = g.grupos.map(x => x.texto).join(' ');
      const n = hablada.reduce((a, h) => a + (txt.split(h).length - 1), 0);
      if (n > 1 && !g.curvaLlegaEnGrupo)
        malos.push(`${k}: "${g.curvaLlegaEn}" se dice ${n} veces y no declara curvaLlegaEnGrupo`);
    }
    return malos.length === 0 ? true
      : malos.join(' · ') + ' — el calibrador cogerá la PRIMERA y la curva llegará antes de tiempo';
  });

  // El bug que costó CUATRO rondas de "los subtítulos van tarde". Los tiempos de las tarjetas
  // siempre estuvieron bien (medido: desvío 0.00s por grupo contra la voz real); lo que fallaba
  // era CUÁL se elegía para pintar. La anterior aguantaba hasta `sig.t0` mientras la siguiente ya
  // cumplía desde `sig.t0 - lead`, y `find` devolvía la primera del array: la vieja. La
  // anticipación no se aplicaba nunca y subirla de 0.15 a 0.45 no cambiaba nada.
  check('SUBTITULOS: la tarjeta entra ANTES de su palabra (la anticipación se aplica de verdad)', () => {
    if (!W.tarjetaEn) return 'falta tarjetaEn() en el motor';
    const ks = [{t0:1.0, t1:1.6, t:'uno'}, {t0:2.0, t1:2.6, t:'dos'}, {t0:3.0, t1:3.6, t:'tres'}];
    const LEAD = 0.45;
    const malos = [];
    for (let i = 1; i < ks.length; i++){
      const enLead = W.tarjetaEn(ks[i].t0 - 0.2, ks, LEAD);   // 0.2s ANTES de la palabra
      if (!enLead || enLead.t !== ks[i].t)
        malos.push(`en t=${(ks[i].t0-0.2).toFixed(2)} debía verse "${ks[i].t}" y se ve "${enLead ? enLead.t : '(nada)'}"`);
    }
    // y la anterior no puede seguir en pantalla una vez entró la nueva
    const justoDespues = W.tarjetaEn(ks[1].t0 - 0.1, ks, LEAD);
    if (justoDespues && justoDespues.t === 'uno') malos.push('la tarjeta vieja sigue ganando dentro del lead');
    return malos.length === 0 ? true : malos.join(' · ');
  });

  // ── SERIE COMPUESTA: capital inicial + compuesto anual (Buffett) sin romper el S3 ──
  // series() cierra sobre CFG. cargarShort la reasigna -> W.series() da la del Short activo.
  check('series(): el S3 (publicado) NO se movió ni un céntimo tras añadir lump/annual', () => {
    W.cargarShort('s3-stat');                 // síncrono: fija SHORT/CFG/D
    const s = W.series();
    // pmt 500 · 30 años · 7% mensual: valores CONGELADOS (el S3 está en la calle)
    return (s.n === 360 && Math.abs(s.finalContrib - 180000) < 0.5
            && Math.abs(s.finalTotal - 609985.5) < 0.5 && Math.abs(s.gap - 429985.5) < 0.5)
      ? true : `S3 cambió: total=${s.finalTotal} contrib=${s.finalContrib} gap=${s.gap} n=${s.n}`;
  });

  check('series(): el Buffett reproduce la carta de Berkshire ($100 en 1965 -> ~$5.5M)', () => {
    W.cargarShort('buffett-time');
    const s = W.series();
    // lump 100 · 60 años · 19,9525% anual, sub-muestreado a MESES (n=720) con tasa mensual
    // equivalente -> curva fluida, MISMO final al céntimo. contrib PLANO en 100.
    const ok = (s.n === 720 && s.finalContrib === 100 && Math.abs(s.finalTotal - 5502477) < 2000);
    W.cargarShort('s3-stat');                 // deja el motor como estaba para los tests siguientes
    return ok ? true : `Buffett mal: total=${s.finalTotal} contrib=${s.finalContrib} n=${s.n}`;
  });

  // ── SUBTÍTULOS: cada frase ancla a SU bloque de voz (no se adelanta al silencio) ──
  // Regresión: el usuario notó subtítulos por delante de la voz. Causa: el reparto a ritmo global
  // metía la 1ª palabra de una frase en el silencio anterior. Ahora, si nº frases == nº bloques,
  // cada frase arranca en el inicio real de su bloque.
  check('alinearPalabras: la 2ª frase arranca en su bloque, no en el silencio previo', () => {
    const segs = [[0.0, 1.0], [1.5, 2.5]];             // 2 bloques con un hueco 1.0-1.5
    const ws = W.alinearPalabras('One two three. Four five six.', segs);
    const four = ws.find(w => w.w.replace(/[^A-Za-z]/g,'') === 'Four');
    if (!four) return 'no encontró Four';
    if (Math.abs(four.t0 - 1.5) > 0.02) return `Four en ${four.t0.toFixed(2)}, esperaba 1.50`;
    const enHueco = ws.filter(w => w.t0 > 1.02 && w.t0 < 1.48);
    return enHueco.length === 0 ? true : `palabras en el silencio: ${enHueco.map(w=>w.w).join(',')}`;
  });

  // ── MUXER MP4: estructura válida sin concatenar en RAM (crash "al 80%") ──
  // Un Short largo (48s a 24Mbps ~144MB) moría al muxear porque se concatenaba 3x (~576MB).
  // Ahora el Blob toma los trozos directamente; este test fija que los offsets siguen cuadrando.
  check('muxMP4: cajas ftyp|mdat|moov y el mdat mide cabecera+video+audio', async () => {
    const mk = (n, f) => { const b = new Uint8Array(n); b.fill(f); return b; };
    const v = {trozos:[mk(10,1),mk(20,2),mk(30,3)], tamanos:[10,20,30], claves:[1],
               desc:new Uint8Array([0,1,2,3]), w:1080, h:1920};
    const a = {trozos:[mk(5,7),mk(7,8)], tamanos:[5,7], desc:new Uint8Array([9,9]), sr:48000, ch:2};
    const buf = new Uint8Array(await W.muxMP4(v, a).arrayBuffer());
    const be32 = o => (buf[o]<<24|buf[o+1]<<16|buf[o+2]<<8|buf[o+3])>>>0;
    const typ = o => String.fromCharCode(buf[o+4],buf[o+5],buf[o+6],buf[o+7]);
    const cajas = []; let o=0; while(o<buf.length){const sz=be32(o);cajas.push([typ(o),sz,o]);if(sz<=0)break;o+=sz;}
    const orden = cajas.map(c=>c[0]).join(',');
    if (orden !== 'ftyp,mdat,moov') return `cajas ${orden}`;
    const mdat = cajas.find(c=>c[0]==='mdat');
    if (mdat[1] !== 8+60+12) return `mdat ${mdat[1]}, esperaba ${8+60+12}`;
    if (buf[mdat[2]+8] !== 1) return 'el video no empieza en mdat+8';
    const offA = cajas[0][1] + 8 + 60;                 // ftyp + cabecera mdat + tamVideo
    if (buf[offA] !== 7) return 'el audio no empieza en offV+tamVideo';
    return true;
  });

  // ── STAT con decimales (retrocompatibilidad) ──────────────────────────
  check('construirMezcla: no clippea con la voz + sfx', () => {
    const N = voz.length;
    const mix = W.construirMezcla(voz, 1, N, {beats:[1,2], ticks:[0.5], risers:[2], hits:[3]});
    let mx=0; for (const v of mix[0]) mx = Math.max(mx, Math.abs(v));
    return mx <= 0.95 ? true : `pico ${mx.toFixed(3)}`;
  });

  // ── GUION TÉCNICO (visualPorFrase) del Short #7 · con la VOZ REAL cargada ───────────────────
  // Los tests de arriba corren SIN calibrar, y sin `ULTIMA_CAL` el guion técnico ni se evalúa:
  // el barrido de zonas seguras recorría el Read como si fuera de una sola escena, y además
  // paraba en t=32 (el Short dura 62,7s), o sea que la MITAD del video no se testeaba nunca.
  // Estos tres cargan data/voz-short-read.mp3, calibran y barren el video entero.
  const conRead = (async () => {
    W.cargarShort('read-janitor');
    W.document.getElementById('voz-proyecto').click();
    for (let i = 0; i < 80 && !W.estadoMotor().ULTIMA_CAL; i++) await new Promise(r => setTimeout(r, 250));
    const e = W.estadoMotor();
    return !!(e.ULTIMA_CAL && e.ULTIMA_CAL.frases && e.CFG.ref === 'ronald-read-janitor-2026-07');
  })();

  check('GUION TÉCNICO: hay un plano resuelto para las 22 frases (ninguna cae al fallback)', async () => {
    if (!await conRead) return 'no se pudo calibrar la voz del Read';
    const {CFG, ULTIMA_CAL: cal, escenas: registradas} = W.estadoMotor();
    const plan = CFG.visualPorFrase;
    if (!plan) return 'el Short no declara visualPorFrase';
    if (plan.length !== cal.frases.length) return `${plan.length} planos para ${cal.frases.length} frases`;
    const escenas = new Set();
    for (let i = 0; i < plan.length; i++){
      let e = CFG.escena;
      for (let k = i; k >= 0; k--){ const v = plan[k]; if (v){ e = (typeof v === 'object') ? v.escena : v; break; } }
      if (!registradas.includes(e)) return `frase ${i}: escena '${e}' no está en SCENES`;
      escenas.add(e);
    }
    // un solo plano en 62s sería el "video plano" que este trabajo vino a arreglar
    return escenas.size >= 4 ? true : `solo ${escenas.size} escenas distintas en todo el Short`;
  });

  // Mide el TEXTO, no los píxeles claros. El barrido por color no distingue una letra de un
  // gráfico blanco: la bola de nieve entra en la franja derecha a propósito (crece hasta salirse
  // de cuadro) y daba un falso positivo. Aquí se intercepta `text()` y se transforma su caja con
  // la MATRIZ del contexto — que es justo donde estaba el bug del `$8,000,000`.
  check('GUION TÉCNICO: ninguna LETRA cae en la franja de los botones (los 62s, calibrado)', async () => {
    if (!await conRead) return 'no se pudo calibrar la voz del Read';
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    const S = {top:190, bottom:360, left:70, right:130};
    const malos = [];
    let ahora = 0;
    W.__auditText = ({str, x0, w, alpha}) => {
      if (alpha <= 0.3 || !str.trim()) return;
      if (x0 < S.left - 3 || x0 + w > c.width - S.right + 3)
        malos.push(`t=${ahora.toFixed(1)} "${str.slice(0,18)}" [${Math.round(x0)}..${Math.round(x0+w)}]`);
    };
    try {
      for (ahora = 0.4; ahora < W.estadoMotor().T.total; ahora += 0.4){
        W.drawFrame(ahora);
        if (malos.length > 3) break;
      }
    } finally { delete W.__auditText; }
    return malos.length === 0 ? true : malos.slice(0,3).join(' · ');
  });

  check('GUION TÉCNICO: ninguna frase se queda en un frame vacío (todo plano pinta algo)', async () => {
    if (!await conRead) return 'no se pudo calibrar la voz del Read';
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    // ⚠ ESTE ES EL TEST QUE HABRÍA CAZADO EL CHOQUE DE NOMBRES `pintarChecklist` (2026-07-26):
    // la escena existía, la llamada ocurría y NO había ningún error de JavaScript — simplemente
    // otra función del panel se llamaba igual y ganaba, así que el checklist salía en blanco.
    // BARRIDO COMPLETO, no un frame por frase. Los huecos no estaban en mitad de las frases sino
    // en los CORTES: el plano se activa 0.2s antes que su frase y sus elementos entraban con la
    // frase, así que cada cambio de plano abría con un frame vacío (medidos: 5.5, 13.5, 29.5,
    // 32.0). Un muestreo por frase pasa por encima de todos ellos.
    const flojas = [];
    for (let t = 0; t <= W.estadoMotor().T.total; t += 0.2){
      W.drawFrame(t);
      const d = cx.getImageData(0, 400, c.width, 900).data;      // la franja que el ojo mira
      let claros = 0;
      for (let p = 0; p < d.length; p += 4*61) if (d[p] > 150 && d[p+1] > 150 && d[p+2] > 150) claros++;
      if (claros < 5) flojas.push(`t=${t.toFixed(1)} (${claros} px de tinta)`);
      if (flojas.length > 3) break;
    }
    return flojas.length === 0 ? true : flojas.slice(0, 3).join(' · ');
  });

  // ── INVARIANTES DE SINCRONÍA. Deterministas (sin audio) → valen para CUALQUIER Short ────────
  check('SINCRONÍA (invariante): una tarjeta corta NUNCA roba una palabra `ancla`', () => {
    // Reproduce el bug exacto que causó el "la voz va más rápida que los subtítulos": la tarjeta A
    // es corta, así que crecía robándole la primera palabra a B — y esa palabra era el instante
    // MEDIDO en que arranca la voz de B. B pasaba a empezar en una palabra interpolada y entraba
    // tarde. Con `minDur` alto el robo era sistemático.
    const ws = [
      {w:'No',      t0:0.00, t1:0.10, ancla:true},
      {w:'big',     t0:0.10, t1:0.20, ancla:false},
      {w:'salary.', t0:0.20, t1:0.30, ancla:false},
      {w:'No',      t0:1.00, t1:1.10, ancla:true},     // ← arranque de voz medido
      {w:'hot',     t0:1.10, t1:1.20, ancla:false},
      {w:'tips.',   t0:1.20, t1:1.30, ancla:false},
    ];
    const cards = W.tarjetasDePalabras(ws, 5, 1.05);   // minDur alto: fuerza el robo
    const segunda = cards.find(c => c.t0 >= 0.9);
    if (!segunda) return 'no se generó la segunda tarjeta';
    return Math.abs(segunda.t0 - 1.00) < 0.001
      ? true
      : `la 2ª tarjeta empieza en ${segunda.t0} y su ancla medida es 1.00 (le robaron la palabra)`;
  });

  check('SINCRONÍA (invariante): cada tarjeta lleva un tiempo por palabra (`tw`)', () => {
    const ws = [
      {w:'Own',   t0:0.0, t1:0.3, ancla:true},
      {w:'what',  t0:0.3, t1:0.6, ancla:false},
      {w:'pays.', t0:0.6, t1:0.9, ancla:false},
    ];
    const cards = W.tarjetasDePalabras(ws, 5, 0.5);
    const mal = cards.filter(c => !c.tw || c.tw.length !== c.palabras.length);
    if (mal.length) return `${mal.length} tarjeta(s) sin tiempos por palabra`;
    // y esos tiempos son los MEDIDOS, no interpolados
    return Math.abs(cards[0].tw[0] - 0.0) < 1e-6 && Math.abs(cards[0].tw[1] - 0.3) < 1e-6
      ? true : `tw=${JSON.stringify(cards[0].tw)} no coincide con los t0 de las palabras`;
  });

  check('SINCRONÍA: cada tarjeta abre en el tiempo MEDIDO de su primera palabra', async () => {
    if (!await conRead) return 'no se pudo calibrar la voz del Read';
    const est = W.estadoMotor(), ks = W.cards();
    // ── CON ALINEAMIENTO EXTERNO (tools/alinear_voz.py) la referencia es el reconocimiento de
    // voz: cada palabra trae su instante medido, así que el t0 de la tarjeta DEBE ser el de su
    // primera palabra, sin desviación. Es una comprobación mucho más dura que la de energía.
    if (est.ALINEAMIENTO && est.ALINEAMIENTO.palabras){
      // Dos fuentes MEDIDAS son válidas y el motor elige la mejor para cada palabra: el instante
      // del reconocimiento de voz, o —si ese cae en silencio— el arranque de voz que midió la
      // energía. Lo que NO puede pasar es que el t0 no venga de ninguna de las dos, porque eso
      // significaría que se ha vuelto a estimar.
      const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9']/g,'');
      const arranques = W.segmentarVoz(est.pcm, {minSilMs: 90}).map(s => s[0]);
      const malas = [];
      for (const k of ks){
        const p0 = norm(k.palabras[0]);
        let dAsr = Infinity;
        for (const p of est.ALINEAMIENTO.palabras)
          if (norm(p.w) === p0) dAsr = Math.min(dAsr, Math.abs(p.t0 - k.t0));
        const dVoz = arranques.reduce((m,a) => Math.min(m, Math.abs(a - k.t0)), Infinity);
        // Un token de CIFRA ("$8,000,000.") no existe como palabra en el ASR: `fusionarCifras` une
        // "eight million dollars" en uno solo y hereda el t0 del primero. Ahí la referencia que
        // queda es la energía, con la tolerancia de siempre.
        const umbral = dAsr === Infinity ? 0.12 : 0.02;
        if (Math.min(dAsr, dVoz) > umbral)
          malas.push(`"${k.palabras[0]}" asr ${(dAsr*1000).toFixed(0)}ms / voz ${(dVoz*1000).toFixed(0)}ms`);
      }
      return malas.length === 0 ? true
        : `${malas.length} tarjetas con t0 ESTIMADO: ${malas.slice(0,3).join(' · ')}`;
    }
    // ── SIN alineamiento, la referencia posible es el arranque de energía. Medido tras arreglar
    // el robo de anclas: 66%. El umbral protege contra volver al 34%, que es lo que se veía.
    const arranques = W.segmentarVoz(est.pcm, {minSilMs: 90}).map(s => s[0]);
    const cerca = ks.filter(k => arranques.some(a => Math.abs(a - k.t0) <= 0.12)).length;
    const pct = 100 * cerca / ks.length;
    return pct >= 60 ? true : `solo el ${pct.toFixed(0)}% abre sobre voz medida (antes del arreglo: 34%)`;
  });

  check('CORTES: ningún plano abre con la pantalla casi en blanco', async () => {
    if (!await conRead) return 'no se pudo calibrar la voz del Read';
    const c = W.document.querySelector('canvas'), cx = c.getContext('2d');
    const {CFG, ULTIMA_CAL} = W.estadoMotor(), fr = ULTIMA_CAL.frases, plan = CFG.visualPorFrase;
    const TOL = 0.2;
    const tinta = t => { W.drawFrame(t);
      const d = cx.getImageData(0, 320, c.width, 1000).data; let n = 0;
      for (let i = 0; i < d.length; i += 4*53) if (d[i] > 150 && d[i+1] > 150 && d[i+2] > 150) n++;
      return n; };
    // El corte REAL cae en max(inicio-TOL, finAnterior+TOL): findIndex devuelve el primer match,
    // así que la frase anterior manda mientras su tolerancia siga cubriendo t.
    const flojos = [];
    for (let i = 1; i < plan.length; i++){
      if (!plan[i]) continue;
      const t = Math.max(fr[i].inicio - TOL, fr[i-1].fin + TOL);
      const n = tinta(t + 1/30);
      // 100 con el margen medido: el mínimo real es 124 (checklist) y antes del arreglo de la
      // lista-fantasma el mismo corte abría en ~40 — un rótulo suelto sobre pantalla negra.
      if (n < 100) flojos.push(`corte ${i} (${typeof plan[i]==='object'?plan[i].escena:plan[i]}) t=${t.toFixed(2)}: ${n}`);
    }
    return flojos.length === 0 ? true : flojos.slice(0,3).join(' · ');
  });

  check('SINCRONÍA: cada subtítulo cae sobre el inicio de voz MEDIDO en el audio', async () => {
    if (!await conRead) return 'no se pudo calibrar la voz del Read';
    const pcm = W.estadoMotor().pcm;
    if (!pcm) return 'el motor no tiene la voz decodificada';
    const segs = W.segmentarVoz(pcm);
    if (!segs || !segs.length) return 'no pude segmentar la voz';
    // El criterio NO es "toda tarjeta empieza un bloque": las que cortan dentro de una frase caen
    // a mitad de locución, y eso es correcto. Lo que no puede pasar es que una tarjeta aparezca
    // mientras NO se está diciendo nada — texto en pantalla sobre un silencio es el desfase que se
    // ve. Se exige que su t0 caiga dentro de un bloque de voz medido (margen de 150 ms).
    // 0.35 con alineamiento externo: el reconocimiento de voz sitúa el arranque de la palabra en
    // su primer fonema (la "N" de "No" suena antes de que la ENERGÍA suba), así que va un pelo por
    // delante del detector de energía — y eso es más preciso, no menos. Sin alineamiento, 0.15.
    const M = W.estadoMotor().ALINEAMIENTO ? 0.35 : 0.15;
    const malas = [];
    for (const k of W.cards()){
      const dentro = segs.some(([a, b]) => k.t0 >= a - M && k.t0 <= b + M);
      if (!dentro){
        const cerca = segs.reduce((m, [a]) => Math.abs(a - k.t0) < Math.abs(m - k.t0) ? a : m, segs[0][0]);
        malas.push(`"${(k.palabras||[]).join(' ').slice(0,18)}" en t=${k.t0.toFixed(2)} (voz más cercana ${cerca.toFixed(2)})`);
      }
    }
    return malas.length === 0 ? true : `${malas.length} tarjetas sobre silencio: ${malas.slice(0,3).join(' · ')}`;
  });

  await Promise.all(pendientes);              // espera los tests async (p.ej. el muxer lee el Blob)
  const res = document.getElementById('res');
  res.textContent = fail === 0 ? `✅ ${pass} tests PASAN` : `❌ ${fail} FALLAN de ${pass+fail}`;
  res.className = fail === 0 ? 'ok' : 'bad';
};

// El src se asigna AQUÍ, después del onload, y con cache-bust: los tests tienen que correr contra
// el archivo del disco, no contra lo que el navegador guardó la última vez.
document.getElementById('motor').src = 'short-renderer.html?_test=' + Date.now();
</script>
