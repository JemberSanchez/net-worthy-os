# Topic queue for /producir. Lives in the PRIVATE state repo (net-worthy-data) as
# .github/workflows/cola.yml: nothing periodic runs on the user's PC (14-nov), and Actions logs of
# a private repo stay private (analytics, topics). Installed by hand once (docs/ESTADO.md, "Cola").
#
# Each run: restores omega.sql, runs ingest -> youtube-scan -> signals -> analytics-sync -> meta-sync
# -> decide, sheets candidate clips per topic, and commits omega.sql + cola/ back here.
# The PC side never loses work: estado-bajar fast-forwards only a local DB with no unsynced changes,
# and estado-subir refuses to overwrite a run that landed mid-session (omega/estado.py).
name: cola
on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC daily, before the US morning
  workflow_dispatch:
concurrency: cola
permissions:
  contents: write
jobs:
  cola:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JemberSanchez/net-worthy-os # public code repo
          path: code
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, this repo, where omega/estado.py expects its clone
        with:
          path: code/data/.estado
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Dependencies
        working-directory: code
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          # same filter as tools/setup_nube.sh: no GUI opencv (no libGL), no piper (no voice here)
          pip install -q -r <(grep -vE '^(opencv-python|piper-tts)' requirements.txt) opencv-python-headless
      - name: Credentials
        working-directory: code
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_TOKEN_JSON: ${{ secrets.META_TOKEN_JSON }}
        run: |
          [ -n "$YOUTUBE_TOKEN_JSON" ] && printf '%s' "$YOUTUBE_TOKEN_JSON" > data/youtube_token.json
          [ -n "$META_TOKEN_JSON" ] && printf '%s' "$META_TOKEN_JSON" > data/meta_token.json
          true
      - name: Queue
        working-directory: code
        env:
          ESTADO_REPO: ${{ github.server_url }}/${{ github.repository }}.git
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PYTHONIOENCODING: utf-8
        run: python -m omega.cli cola-preparar
